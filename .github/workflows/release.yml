name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 同一 tag 被重推(force-push tag)时不得并发:两轮会同时往同一个 draft release
# 传产物、互相覆盖。cancel-in-progress 取 false —— 宁可排队,也不要在上传中途
# 掐断留下半截 release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发版门禁:tag 一推就直接构建太危险,先过一遍与 CI lint job 同构的检查。
  # 三个平台 job 全部 needs 它 —— 门禁不过,一个产物都不发。
  gate:
    name: Gate (fmt + clippy + tsc + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tag 与包内版本必须一致:否则打了 v0.4.4 的 tag,装出来的包自己却报 0.4.3
      # (codex 终审)。三个版本源一处都不能漏:package.json / Cargo.toml / tauri.conf.json
      - name: Tag 与包内版本一致性
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(grep -m1 '^version *= *"' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag package.json=$pkg Cargo.toml=$cargo_v tauri.conf.json=$conf"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo_v" ] || [ "$tag" != "$conf" ]; then
            echo "::error::版本不一致:tag v$tag 与包内版本(package.json=$pkg, Cargo.toml=$cargo_v, tauri.conf.json=$conf)必须相同"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # build.rs(tauri-build)会校验 externalBin 路径存在,cargo 侧检查也需要 sidecar
      - name: Cache ffmpeg sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # 创建 draft 必须是**单点**动作,放在三条平台腿的共同前置里。
      # 此前是交给 tauri-action 顺手创建:哪条腿先跑完谁创建,后两条 attach。
      # v0.3.9 三条腿同时没找到 draft、同时去创建,全部被拒
      # (Resource not accessible by integration),三平台白构建 20 分钟才暴露。
      # 收敛到这里之后:只有一个创建者、没有竞态;真出问题也在几分钟内就红,
      # 不用等构建跑完。幂等——draft 已存在(如重推 tag)就跳过。
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release/draft $TAG 已存在,跳过创建"
            exit 0
          fi
          if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "OCard $TAG" \
              --notes "产物由 release 工作流附加;齐备后由 finalize 追加标记。"; then
            echo "::error::创建 draft release 失败。三平台构建已提前中止(不再白跑)。"
            echo "::error::排查:仓库 Settings→Actions→Workflow permissions 是否允许写入;"
            echo "::error::本 workflow 顶层已声明 contents: write,可对照 Set up job 日志里的 GITHUB_TOKEN Permissions。"
            exit 1
          fi

  # Linux / Windows 完全接触不到 Apple 凭据(凭据只进 release-macos)
  release-linux:
    name: Release (linux)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          # squashfs-tools/zstd/xvfb/dbus:AppImage 重打包修复 + 冒烟
          # (scripts/fix-appimage-wayland.sh)
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools zstd xvfb dbus

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 externalBin 指向 src-tauri/binaries/ffmpeg|ffprobe,
      # 干净 runner 上这些文件不存在 → 不拉取则 tauri build 必失败。
      # 与 CI 保持同一套拉取+SHA-256 校验(fail-closed,scripts/fetch-ffmpeg.sh)。
      - name: Cache ffmpeg sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OCard ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # 包装脚本:build 结束后、tauri-action 收集产物/生成 latest.json 之前,
          # 就地剔除 AppImage 捆绑的 libwayland-* 并重签名 —— 根治 Mesa 25+/
          # Wayland 宿主上 WebKitWebProcess 的 EGL_BAD_PARAMETER 崩溃
          # (tauri-apps/tauri#15665,实机 coredump 复现)。后置 step 来不及,
          # 只能走 tauriScript。
          tauriScript: bash scripts/tauri-build-wrapper.sh

      # 与 CI 共用同一脚本:真正发给用户的产物也必须逐字节钉死。
      # 失败即让 job 红 —— 宁可不发版,也不发一个 sidecar/模型对不上的包。
      - name: Verify sidecars & model in release bundle (fail-closed)
        shell: bash
        run: bash scripts/verify-bundle.sh

  release-windows:
    name: Release (windows)
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # 同 release-linux:externalBin 前置,干净 runner 必须先拉 sidecar。
      # fetch 脚本是 bash,windows runner 默认 shell 为 pwsh → 显式 shell: bash(git-bash)
      - name: Cache ffmpeg sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OCard ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # 同 release-linux:发出去的产物必须过同一套 SHA-256 钉死校验
      - name: Verify sidecars & model in release bundle (fail-closed)
        shell: bash
        run: bash scripts/verify-bundle.sh

  release-macos:
    name: Release (macos, signed + notarized)
    needs: gate
    # 固定 macos-15:签名链对 runner 镜像/Xcode 迁移敏感,升级走定期 PR 而非跟随 latest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # fail-closed:正式标签构建缺任何签名/公证凭据必须失败,而不是发未签名产物
      - name: Ensure signing credentials present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::缺少 Secret: $v"; missing=1; fi
          done
          exit $missing

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # 同 release-linux:externalBin 前置,干净 runner 必须先拉 sidecar
      - name: Cache ffmpeg sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build, sign, notarize and attach to GitHub Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OCard ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # 构建后验证:签名、Gatekeeper 评估、公证 staple 三关全过才算合格产物
      - name: Verify signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          # -print -quit 而非 `| head -1`(无管道、不吃 SIGPIPE),末尾 || true
          # 保证 find 自身失败也落到下面的显式判空,而不是无注解终止
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -print -quit || true)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          echo "Verifying: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -t exec -vv "$APP"
          xcrun stapler validate "$APP"

      # 同 linux/windows,但走 --signed:codesign 会重写 .app 内嵌 Mach-O 字节,
      # 包内 sidecar 哈希必然与钉死值不同 → 脚本改验签名有效性 + 钉死源字节,
      # 并打 ::warning:: 明示这层降级(禁止无提示 fail-open)
      - name: Verify sidecars & model in release bundle (fail-closed)
        shell: bash
        run: bash scripts/verify-bundle.sh --signed

  # 发布防呆(v0.3.3 事故复盘):draft 在 linux 腿(最慢,AppImage 重打包)
  # 完成前被 publish,后续产物落进游离 draft。三平台全部收尾后才在
  # release 说明末尾盖「产物齐备」标记——publish 前先看到这行再点。
  finalize:
    name: Finalize (产物齐备标记)
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release assets complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BODY=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body)
          COUNT=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          NOTE="✅ 三平台产物齐备(共 $COUNT 个,finalize 自动标记)——现在可以 publish。看不到这一行时请勿发布:linux 腿可能还在跑,提前 publish 会把剩余产物挤进游离 draft(v0.3.3 事故)。"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$BODY"$'\n\n'"$NOTE"
