name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR 分支:新 push 顶掉旧 head 的在途 run(旧 head 不再需要验证)。
# main:绝不取消,排队跑完——每个落地 commit 都必须拿到完整绿章
# (教训:R2 波连推时多个 main run 被顶成 cancelled,代码落地却从未被 CI 完整验证)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认最小权限:只有 e2e job 因需推 e2e-shots 分支单独提权到 contents: write
permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Cache ffmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  build:
    name: Build (${{ matrix.platform }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            # macos-latest 当前为 arm64,verify-bundle.sh 里对应硬编码
            # ffmpeg/ffprobe-aarch64-apple-darwin 条目。若 runner 架构漂移,
            # 脚本的 want_of 会以 ::error::「SHA256SUMS.txt 缺少条目」显式报错,
            # 不会静默放行 → 保持现状不钉版本,靠这层兜底暴露。
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 路径/rename/卷检测行为平台相关,Rust 测试三平台全跑(评审建议)
      - name: Cache ffmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # CI 只验证打包链路;updater 工件需签名私钥,仅在 Release 工作流生成,
      # 私钥不进普通 CI(暴露面最小化)
      - name: Build Tauri bundles
        # 用文件而非内联 JSON:Windows pwsh 会吞内联引号
        run: pnpm tauri build --config src-tauri/ci-no-updater.conf.json

      # 与 Release 三平台共用同一脚本(scripts/verify-bundle.sh),避免两边漂移。
      # fail-closed 风格原样保留:每项显式判错 + ::error:: 注解,不做 && 链。
      - name: Verify sidecars & model in build output (W9,fail-closed)
        shell: bash
        run: bash scripts/verify-bundle.sh

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ocard-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app/**
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  e2e:
    name: E2E (linux, tauri-driver)
    needs: lint
    env:
      # 钉死版本(crates.io 最新稳定版),升级走显式 PR 而非跟随上游
      TAURI_DRIVER_VERSION: "2.0.6"
    permissions:
      # 只有 push(main)才需要写权限去推 e2e-shots 分支。
      # GitHub 不允许 jobs.<id>.permissions 用 ${{ }} 表达式按事件区分,
      # 所以这里保持 job 级 write,由发布步骤的 if 条件挡掉 PR 场景:
      # PR(尤其 fork PR)只走 artifact 上传,拿到的也是只读 token,不会误用写权限。
      contents: write # 推送 e2e-shots 截图分支(仅此 job,且仅 push 事件实际使用)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2 + WebDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb fonts-noto-cjk

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本钉死:上游发新版不得静默漂移;cache key 带版本号,
      # 否则改版本后仍会命中旧 cache、把漂移掩盖成"没变化"
      - name: Cache tauri-driver binary
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      - run: pnpm install --frozen-lockfile

      - name: Cache ffmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build app (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle

      - name: Run E2E smoke
        run: xvfb-run --auto-servernum pnpm --filter ocard-e2e test

      - name: Upload E2E screenshots (真实界面巡览图+失败现场)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14
          path: e2e/screenshots/*.png

      # 仅 push(main)发布:PR(特别是 fork PR)拿到的是只读 token,推分支必 403 变红;
      # PR 场景截图仍可从上一步的 e2e-screenshots artifact 取,信息不丢。
      - name: Publish screenshots to e2e-shots branch + 内嵌进 Job Summary
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -uo pipefail
          # 发布链路(git push / Summary 写入)失败不得炸掉整个 E2E job:
          # 截图 artifact 已单独上传,分支发布只是便捷预览 → 降级为 ::warning:: 且必须可见。
          trap 'echo "::warning::截图发布失败(第 $LINENO 行),artifact 仍可用"; exit 0' ERR
          set -e
          shopt -s nullglob
          shots=(e2e/screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "::warning::E2E 未产出任何截图,跳过发布"; exit 0
          fi
          # 孤儿分支只保留最新一次(单提交,主干历史零污染)
          pub=$(mktemp -d)
          i=0
          : > "$pub/INDEX.md"
          for f in "${shots[@]}"; do
            i=$((i+1))
            n=$(printf "%02d" "$i")
            cp "$f" "$pub/$n.png"
            echo "- $n.png ← $(basename "$f")" >> "$pub/INDEX.md"
          done
          cd "$pub"
          git init -q -b e2e-shots
          git -c user.name="ocard-ci" -c user.email="ci@ocard.local" add .
          git -c user.name="ocard-ci" -c user.email="ci@ocard.local"             commit -q -m "E2E screenshots @ ${GITHUB_SHA::8}"
          git push -qf             "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             e2e-shots
          NEW=$(git rev-parse HEAD)
          {
            echo "## E2E 界面截图(真实应用,${#shots[@]} 张)"
            echo ""
            echo "分支直览:[e2e-shots](https://github.com/${GITHUB_REPOSITORY}/tree/e2e-shots)"
            echo ""
            i=0
            for f in "${shots[@]}"; do
              i=$((i+1))
              n=$(printf "%02d" "$i")
              base=$(basename "$f" .png)
              echo "<details open><summary>${base}</summary>"
              echo ""
              echo "<img width=\"640\" alt=\"${base}\" src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NEW}/${n}.png\">"
              echo ""
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
