name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Cache ffmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  build:
    name: Build (${{ matrix.platform }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 路径/rename/卷检测行为平台相关,Rust 测试三平台全跑(评审建议)
      - name: Cache ffmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # CI 只验证打包链路;updater 工件需签名私钥,仅在 Release 工作流生成,
      # 私钥不进普通 CI(暴露面最小化)
      - name: Build Tauri bundles
        # 用文件而非内联 JSON:Windows pwsh 会吞内联引号
        run: pnpm tauri build --config src-tauri/ci-no-updater.conf.json

      - name: Verify sidecars & model in build output (W9,fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          # 评审 P0-2:逐条显式判错(set -e 豁免 && 左操作数,不许用 && 链);
          # 附 SHA-256 校验与模型资源;Linux 额外解包 .deb 验安装包内容
          fail() { echo "::error::$1"; exit 1; }
          need_file() { [ -f "$1" ] || fail "缺少 $1"; }
          need_exec() { [ -x "$1" ] || fail "缺少或不可执行 $1"; }
          sha_of() { shasum -a 256 "$1" 2>/dev/null | awk '{print $1}' || sha256sum "$1" | awk '{print $1}'; }
          MODEL_SHA="8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
          case "${{ runner.os }}" in
            macOS)
              APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
              [ -n "$APP" ] || fail "未找到 .app"
              need_exec "$APP/Contents/MacOS/ffmpeg"
              need_exec "$APP/Contents/MacOS/ffprobe"
              want=$(grep " ffmpeg-aarch64-apple-darwin$" src-tauri/binaries/SHA256SUMS.txt | awk '{print $1}')
              got=$(sha_of "$APP/Contents/MacOS/ffmpeg")
              [ "$got" = "$want" ] || fail "app 内 ffmpeg SHA 不符: $got"
              MODEL=$(find "$APP/Contents/Resources" -name "face_detection_yunet_2023mar.onnx" | head -1)
              [ -n "$MODEL" ] || fail "app 内缺少 YuNet 模型"
              [ "$(sha_of "$MODEL")" = "$MODEL_SHA" ] || fail "app 内模型 SHA 不符"
              ;;
            Linux)
              DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
              [ -n "$DEB" ] || fail "未找到 .deb"
              rm -rf /tmp/ocard-deb && mkdir -p /tmp/ocard-deb
              dpkg-deb -x "$DEB" /tmp/ocard-deb
              FF=$(find /tmp/ocard-deb -name ffmpeg -type f | head -1)
              [ -n "$FF" ] || fail ".deb 内缺少 ffmpeg"
              want=$(grep " ffmpeg-x86_64-unknown-linux-gnu$" src-tauri/binaries/SHA256SUMS.txt | awk '{print $1}')
              [ "$(sha_of "$FF")" = "$want" ] || fail ".deb 内 ffmpeg SHA 不符"
              FP=$(find /tmp/ocard-deb -name ffprobe -type f | head -1)
              [ -n "$FP" ] || fail ".deb 内缺少 ffprobe"
              MODEL=$(find /tmp/ocard-deb -name "face_detection_yunet_2023mar.onnx" | head -1)
              [ -n "$MODEL" ] || fail ".deb 内缺少 YuNet 模型"
              [ "$(sha_of "$MODEL")" = "$MODEL_SHA" ] || fail ".deb 内模型 SHA 不符"
              ;;
            Windows)
              # 安装包内容核查由 mac/linux 腿覆盖同一打包路径(声明边界);
              # 此处验暂存产物存在性+SHA
              need_file "src-tauri/target/release/ffmpeg.exe"
              need_file "src-tauri/target/release/ffprobe.exe"
              want=$(grep " ffmpeg-x86_64-pc-windows-msvc.exe$" src-tauri/binaries/SHA256SUMS.txt | awk '{print $1}')
              [ "$(sha_of "src-tauri/target/release/ffmpeg.exe")" = "$want" ] || fail "ffmpeg.exe SHA 不符"
              MODEL=$(find src-tauri/target/release -name "face_detection_yunet_2023mar.onnx" | head -1)
              [ -n "$MODEL" ] || fail "缺少 YuNet 模型暂存"
              ;;
            *) fail "未知平台 ${{ runner.os }}" ;;
          esac
          echo "sidecars + model verified (SHA-256)"

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ocard-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app/**
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  e2e:
    name: E2E (linux, tauri-driver)
    needs: lint
    permissions:
      contents: write # 推送 e2e-shots 截图分支(仅此 job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri v2 + WebDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache tauri-driver binary
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v1

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      - name: Cache ffmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('src-tauri/binaries/SHA256SUMS.txt') }}

      - name: Fetch ffmpeg sidecar (SHA-256 校验)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build app (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle

      - name: Run E2E smoke
        run: xvfb-run --auto-servernum pnpm --filter ocard-e2e test

      - name: Upload E2E screenshots (真实界面巡览图+失败现场)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14
          path: e2e/screenshots/*.png

      - name: Publish screenshots to e2e-shots branch + 内嵌进 Job Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(e2e/screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "无截图可发布"; exit 0
          fi
          # 孤儿分支只保留最新一次(单提交,主干历史零污染)
          pub=$(mktemp -d)
          i=0
          : > "$pub/INDEX.md"
          for f in "${shots[@]}"; do
            i=$((i+1))
            n=$(printf "%02d" "$i")
            cp "$f" "$pub/$n.png"
            echo "- $n.png ← $(basename "$f")" >> "$pub/INDEX.md"
          done
          cd "$pub"
          git init -q -b e2e-shots
          git -c user.name="ocard-ci" -c user.email="ci@ocard.local" add .
          git -c user.name="ocard-ci" -c user.email="ci@ocard.local"             commit -q -m "E2E screenshots @ ${GITHUB_SHA::8}"
          git push -qf             "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             e2e-shots
          NEW=$(git rev-parse HEAD)
          {
            echo "## E2E 界面截图(真实应用,${#shots[@]} 张)"
            echo ""
            echo "分支直览:[e2e-shots](https://github.com/${GITHUB_REPOSITORY}/tree/e2e-shots)"
            echo ""
            i=0
            for f in "${shots[@]}"; do
              i=$((i+1))
              n=$(printf "%02d" "$i")
              base=$(basename "$f" .png)
              echo "<details open><summary>${base}</summary>"
              echo ""
              echo "<img width="640" alt="${base}" src="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NEW}/${n}.png">"
              echo ""
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
