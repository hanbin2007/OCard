[package]
name = "ocard"
version = "0.2.0"
description = "内部 DIT 素材备份管理工具"
authors = ["Hanbin Zhang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ocard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
percent-encoding = "2"
rayon = "1.10"
sha2 = "0.11"
hex = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.53.1", features = ["time"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6.1"
libc = "0.2.189"

[dev-dependencies]
tempfile = "3"

# 集成测试网(M3 W1):mock runtime 驱动真实 invoke_handler。
# Windows 上启用 tauri `test` feature 会让测试二进制 STATUS_ENTRYPOINT_NOT_FOUND
# (上游 mock runtime 链接问题),故仅非 Windows 目标启用——集成网逻辑平台无关,
# 由 Linux/macOS CI 腿覆盖;Windows 腿仍跑全部单元测试。
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

