[package]
name = "ocard"
version = "0.4.1"
description = "内部 DIT 素材备份管理工具"
authors = ["Hanbin Zhang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ocard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 声明边界(R2 P2 台账):download-binaries 让 ort-sys 构建期从 pyke CDN 拉取
# ONNX Runtime 预编译静态库,该制品未纳入本仓侧 SHA-256 校验——制品身份仅由
# Cargo.lock 钉死的 ort-sys 精确版本间接决定(模型文件本身仍有启动期 SHA 校验,
# 见 core/yunet.rs)。钉死方案(vendored 库 + ORT_LIB_LOCATION)留待有真实需求时评估。
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
percent-encoding = "2"
rayon = "1.10"
sha2 = "0.11"
hex = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.53.1", features = ["time"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6.1"
libc = "0.2.189"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
# 落点撞名判定必须做 Unicode NFC 归一:macOS 相机卡上的 `é.mov` 可能是 NFC,
# 也可能是 NFD(两串字节不同、目的地文件系统却视为同一个文件名)。不归一就会
# 把两个源规划成两个「不冲突」的落点,内容相同时第二个直接复用第一个的物理文件
# 并报 all_verified——两个源最终只剩一个目录项。NFC 需要完整 UCD 分解/合成表
# (数千行数据),自己实现既大又易错,故引入这个只做归一、无传递重依赖的小库。
unicode-normalization = "0.1.25"
# 落点撞名判定的第二层归一:Unicode **默认大小写折叠**(CaseFolding.txt 的 C+F 类)。
# 为什么不能用 `to_lowercase()`:APFS/exFAT 的大小写不敏感比较按 Unicode 折叠实现,
# 要求 σ / ς / Σ 三者等价,而 `to_lowercase()` 把 ς 原样留作 ς(它本来就是小写),
# 于是大小写敏感的源卷上 `σ.mov` 与 `ς.mov` 会被规划成两个「不冲突」的落点;
# 内容相同时第二项直接复用第一项的物理文件并报 all_verified——两个源只剩一个目录项。
# `str::to_lowercase` 还带 Final_Sigma 位置规则(`ΟΔΟΣ` → `οδος` 末位是 ς),
# 同一个名字的大小写变体因此会折出不同的键,是同型缺陷的第二个入口。
# 折叠需要 CaseFolding.txt 全表(千余条映射),手写既大又易错;caseless 只做折叠、
# 唯一依赖是本仓已有的 unicode-normalization,无 build 脚本,是最小的正确解。
caseless = "0.2.2"

[dev-dependencies]
tempfile = "3"

# 集成测试网(M3 W1):mock runtime 驱动真实 invoke_handler。
# Windows 上启用 tauri `test` feature 会让测试二进制 STATUS_ENTRYPOINT_NOT_FOUND
# (上游 mock runtime 链接问题),故仅非 Windows 目标启用——集成网逻辑平台无关,
# 由 Linux/macOS CI 腿覆盖;Windows 腿仍跑全部单元测试。
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

